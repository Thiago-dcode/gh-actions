
name: Run tests
description: Installs the project with the chosen package manager (pnpm, npm or yarn), then runs its lint and test scripts. The calling job must check out the repo first.
author: Thiago-dcode
branding:
  icon: check-circle
  color: green

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "24"
  package-manager:
    description: >-
      Package manager used to install dependencies, lint and test.
      Supported values: pnpm, npm, yarn (lowercase).
    required: false
    default: pnpm

runs:
  using: composite
  steps:
    - name: Validate package manager
      shell: bash
      env:
        PM: ${{ inputs.package-manager }}
      run: |
        case "$PM" in
          pnpm|npm|yarn) ;;
          *)
            echo "::error title=Unsupported package manager::'$PM' is not supported. Supported values: pnpm, npm, yarn."
            exit 1
            ;;
        esac

    # pnpm is not preinstalled, so it needs its own action. It must run BEFORE
    # setup-node so that `cache: pnpm` can find the pnpm executable.
    - name: Setup pnpm
      if: ${{ inputs.package-manager == 'pnpm' }}
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # npm ships with Node and yarn (classic) is preinstalled on GitHub-hosted runners,
    # so neither needs an extra setup step.
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}

    - name: Install dependencies
      shell: bash
      env:
        PM: ${{ inputs.package-manager }}
      run: |
        case "$PM" in
          pnpm) pnpm install --frozen-lockfile ;;
          npm)  npm ci ;;
          yarn)
            if [ "$(yarn --version | cut -d. -f1)" -ge 2 ]; then
              yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
            ;;
        esac

    # Runs the "lint" and "test" scripts from the project's root package.json.
    # Each project decides what they do (e.g. "turbo run lint" in a Turborepo).
    - name: Lint
      shell: bash
      env:
        PM: ${{ inputs.package-manager }}
      run: $PM run lint

    - name: Run tests
      shell: bash
      env:
        NODE_ENV: test
        PM: ${{ inputs.package-manager }}
      run: $PM run test
