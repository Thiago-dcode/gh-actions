name: Purge Cloudflare cache
description: Purges the Cloudflare cache for one hostname. Problems are logged as warnings and never fail the step.
author: Thiago-dcode
branding:
  icon: message-circle
  color: blue

inputs:
  domain:
    description: Hostname to purge, e.g. a11studio.com. Only this host is purged.
    required: true
  api-token:
    description: Zone-scoped "Cache Purge" API token. Pass it from a secret.
    required: false
    default: ""
  zone-id:
    description: ID of the Cloudflare zone that serves the domain.
    required: false
    default: ""

runs:
  using: node24 # node20 on older setups
  main: dist/index.js # the built file, not index.js
