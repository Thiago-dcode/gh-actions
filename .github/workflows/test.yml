name: test

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test js action
        id: greet
        uses: ./.github/actions/cloudflare-purge-cache
        with:
          who: thiago
          shout: true
      - run: echo "${{ steps.hello.outputs.greeting }}"
